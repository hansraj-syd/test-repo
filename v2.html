<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>STIRBoy Tomnexter v2</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    background: #3a3a5c; display: flex; justify-content: center; align-items: center;
    font-family: 'Press Start 2P', monospace;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #gameboy {
    background: linear-gradient(145deg, #c8c8c8 0%, #a8a8a8 50%, #989898 100%);
    border-radius: 16px 16px 80px 16px; padding: 8px 8px 10px;
    width: 100%; height: 100%; max-width: 500px; max-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 4px 4px 0 #666, inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
  }
  .top-brand { color: #6a6a8a; font-size: 7px; letter-spacing: 3px; margin-bottom: 2px; }
  #screen-bezel {
    background: #4a4a6a; border-radius: 8px; padding: 5px 5px 3px;
    width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .screen-label { color: #8888aa; font-size: 5px; margin-bottom: 2px; letter-spacing: 2px; display: flex; justify-content: space-between; }
  .screen-label .dot { width: 6px; height: 6px; background: #c03030; border-radius: 50%; display: inline-block; }
  #game-container { width: 100%; flex: 1; min-height: 0; border-radius: 4px; overflow: hidden; }
  #game-container canvas { width: 100% !important; height: 100% !important; display: block; }
  .screen-bottom-label { color: #8888aa; font-size: 4px; text-align: center; margin-top: 1px; letter-spacing: 4px; }

  #controls {
    width: 100%; display: flex; justify-content: space-between; align-items: stretch;
    padding: 8px 4px 2px; flex-shrink: 0; gap: 6px;
  }
  .move-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .arrow-btn {
    width: 72px; height: 80px; background: #1a1a1a; border: 3px solid #444;
    border-radius: 14px; color: #eee; font-size: 36px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    -webkit-tap-highlight-color: transparent; box-shadow: 3px 4px 0 rgba(0,0,0,0.6);
  }
  .arrow-btn:active { background: #444; transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  .fire-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .fire-btn {
    width: 80px; height: 80px; border-radius: 14px; border: 3px solid rgba(255,255,255,0.3);
    font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #fff;
    -webkit-tap-highlight-color: transparent; box-shadow: 3px 4px 0 rgba(0,0,0,0.5);
  }
  .fire-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
  .btn-lhs { background: #c02020; }
  .btn-rhs { background: #1858b8; }
  .meta-buttons { display: flex; gap: 20px; margin-top: 3px; flex-shrink: 0; }
  .meta-btn {
    width: 52px; height: 14px; border-radius: 7px; border: none; background: #777;
    font-family: 'Press Start 2P', monospace; font-size: 5px; color: #444;
    cursor: pointer; transform: rotate(-8deg); -webkit-tap-highlight-color: transparent;
  }
  .meta-btn:active { background: #999; }
  .speaker { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 3px; transform: rotate(-25deg); }
  .speaker-line { width: 24px; height: 2px; background: #888; border-radius: 1px; }

  /* Name input overlay */
  #nameOverlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    justify-content: center; align-items: center; flex-direction: column; gap: 12px;
  }
  #nameOverlay.show { display: flex; }
  #nameOverlay label { color: #9bbc0f; font-size: 12px; font-family: 'Press Start 2P', monospace; }
  #nameInput {
    background: #0f380f; color: #9bbc0f; border: 3px solid #8bac0f; border-radius: 8px;
    font-family: 'Press Start 2P', monospace; font-size: 16px; padding: 10px 14px;
    text-align: center; width: 220px; text-transform: uppercase; outline: none;
  }
  #nameInput::placeholder { color: #306230; }
  #nameOk {
    background: #306230; color: #9bbc0f; border: 2px solid #8bac0f; border-radius: 8px;
    font-family: 'Press Start 2P', monospace; font-size: 12px; padding: 8px 24px; cursor: pointer;
  }
  #nameOk:active { background: #8bac0f; color: #0f380f; }

  @media (max-height: 620px) {
    #gameboy { padding: 4px 5px 6px; }
    .arrow-btn { width: 58px; height: 64px; font-size: 28px; }
    .fire-btn { width: 66px; height: 64px; font-size: 11px; }
    #controls { padding: 5px 3px 1px; }
  }
  @media (min-height: 820px) {
    .arrow-btn { width: 82px; height: 90px; font-size: 40px; }
    .fire-btn { width: 90px; height: 90px; font-size: 15px; }
    #controls { padding: 12px 6px 4px; }
  }
</style>
</head>
<body>
<div id="gameboy">
  <div class="top-brand">STIRBoy&trade; TOMNEXTER</div>
  <div id="screen-bezel">
    <div class="screen-label"><span><span class="dot"></span> POWER</span><span>STIRBOY TOMNEXTER</span></div>
    <div id="game-container"></div>
    <div class="screen-bottom-label">&copy; 2026 TOMNEXTER SYSTEMS</div>
  </div>
  <div class="meta-buttons">
    <button class="meta-btn" id="btnTally">TALLY</button>
    <button class="meta-btn" id="btnStart">START</button>
  </div>
  <div id="controls">
    <div class="move-btns">
      <button class="arrow-btn" id="dLeft">&#9664;</button>
      <button class="arrow-btn" id="dRight">&#9654;</button>
    </div>
    <div class="fire-btns">
      <button class="fire-btn btn-rhs" id="btnRHS">RHS</button>
      <button class="fire-btn btn-lhs" id="btnLHS">LHS</button>
    </div>
  </div>
  <div class="speaker"><div class="speaker-line"></div><div class="speaker-line"></div><div class="speaker-line"></div><div class="speaker-line"></div><div class="speaker-line"></div><div class="speaker-line"></div></div>
</div>

<!-- Name entry overlay -->
<div id="nameOverlay">
  <label>ENTER YOUR NAME</label>
  <input id="nameInput" type="text" maxlength="8" placeholder="TRADER" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="nameOk">LET'S GO</button>
</div>

<script>
// ---- CONFIG ----
const GB = { darkest: 0x0f380f, dark: 0x306230, light: 0x8bac0f, lightest: 0x9bbc0f, bg: 0x9bbc0f };
const GBS = { darkest: '#0f380f', dark: '#306230', light: '#8bac0f', lightest: '#9bbc0f', bg: '#9bbc0f' };
const CCYS = ['AUD','NZD','JPY','CHF','EUR','CAD','GBP'];
const ALL_TENORS = [
  { tenor:'T/N', min:500, max:2000 }, { tenor:'S/N', min:500, max:2000 },
  { tenor:'1W', min:500, max:2000 }, { tenor:'2W', min:500, max:1000 },
  { tenor:'1M', min:500, max:1000 }, { tenor:'2M', min:500, max:1000 },
  { tenor:'3M', min:200, max:500 }, { tenor:'6M', min:200, max:500 },
  { tenor:'9M', min:50, max:500 }, { tenor:'1Y', min:50, max:500 },
  { tenor:'2Y', min:50, max:500 },
  { tenor:'PRE-D', min:200, max:1000 }, { tenor:'HRR', min:100, max:500 },
];
const LONG_TENORS = ALL_TENORS.filter(t => ['6M','9M','1Y','2Y'].includes(t.tenor));
const ON_TENORS = ALL_TENORS.filter(t => ['T/N','S/N'].includes(t.tenor));

const MISS_TAUNTS = [
  'TOO SLOW!','CLIENT ANGRY!','SALES ON LINE 2..','BROKER LAUGHING',
  'SHOULDA HEDGED!','TICKET DROPPED!','ASLEEP?!','NICE ONE CHAMP..',
];
const WAVE_LABELS = ['WARMING UP','FLOW PICKING UP','GETTING BUSY','HEAVY FLOW','CARNAGE','FULL SEND'];

const EVENTS = [
  { name:'ES BALANCE EXPLODES!', fx:'chaos', dur:5000 },
  { name:'TAX DAY!', fx:'flood', dur:4000 },
  { name:'$ FUNDING PUKE!', fx:'accel', dur:5000 },
  { name:'DEC/JAN TURN NUKED!', fx:'quake', dur:5000 },
  { name:'IMM ROLL!', fx:'wobbly', dur:6000 },
  { name:'STEEP BASIS CURVE!', fx:'steep', dur:5000 },
  { name:'FLAT BASIS CURVE!', fx:'slow', dur:5000 },
  { name:'REPO RATE SPIKES!', fx:'flood', dur:4000 },
  { name:'XCCY BASIS BLOWS!', fx:'chaos', dur:5000 },
  { name:'RBA SURPRISE OMO!', fx:'omo', dur:6000 },
  { name:'QTR-END SQUEEZE!', fx:'quake', dur:5000 },
  { name:'BOND SETTLE DRAIN!', fx:'small', dur:4000 },
  { name:'EXCESS BILL SUPPLY!', fx:'blink', dur:5000 },
];

// Player name (persisted in localStorage)
let PLAYER_NAME = '';
try { PLAYER_NAME = localStorage.getItem('stirboy_name') || ''; } catch(e){}

function fmtSize(m) { return m >= 1000 ? (m/1000).toFixed(1)+'bn' : m+'m'; }
function ri(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function rEl(a) { return a[Math.floor(Math.random()*a.length)]; }
function hpFor(size) { if(size>=1500) return 4; if(size>=1000) return 3; if(size>=500) return 2; return 1; }

// ---- BOOT SCENE (create textures) ----
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    // Star texture
    let g = this.make.graphics({add:false});
    g.fillStyle(0x306230); g.fillRect(0,0,2,2);
    g.generateTexture('dot', 2, 2); g.destroy();
    // Scanline texture
    let s = this.make.graphics({add:false});
    s.fillStyle(0x000000, 0.06);
    for (let i=0; i<200; i+=2) s.fillRect(0, i, 400, 1);
    s.generateTexture('scanlines', 400, 200); s.destroy();
    this.scene.start('Title');
  }
}

// ---- TITLE SCENE ----
class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }
  create() {
    let W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(GB.bg);

    // Scrolling dots bg
    this.dots = [];
    for (let i = 0; i < 30; i++) {
      let d = this.add.rectangle(ri(0,W), ri(0,H), 2, 2, GB.dark).setAlpha(0.3);
      this.dots.push(d);
    }

    // Scanline overlay
    this.add.tileSprite(0, 0, W, H, 'scanlines').setOrigin(0).setDepth(50).setAlpha(0.5);

    let t1 = this.add.text(W/2, H*0.10, 'STIRBOY', { fontFamily:'"Press Start 2P"', fontSize:'26px', color:GBS.darkest }).setOrigin(0.5);
    let t2 = this.add.text(W/2, H*0.17, 'TOMNEXTER', { fontFamily:'"Press Start 2P"', fontSize:'16px', color:GBS.dark }).setOrigin(0.5);
    this.tweens.add({ targets: [t1,t2], y: '+=5', duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // Ccys parade
    let gap = W / (CCYS.length + 1);
    CCYS.forEach((ccy, i) => {
      let bx = this.add.rectangle(gap*(i+1), H*0.27, 44, 22, GB.darkest);
      let tx = this.add.text(gap*(i+1), H*0.27, ccy, { fontFamily:'"Press Start 2P"', fontSize:'9px', color:GBS.bg }).setOrigin(0.5);
      this.tweens.add({ targets: [bx,tx], y: '+=10', duration: 600, yoyo:true, repeat:-1, delay: i*120, ease:'Sine.easeInOut' });
    });

    // Player name display
    if (PLAYER_NAME) {
      this.add.text(W/2, H*0.35, 'TRADER: ' + PLAYER_NAME, { fontFamily:'"Press Start 2P"', fontSize:'11px', color:GBS.darkest }).setOrigin(0.5);
      let chg = this.add.text(W/2, H*0.39, '[TAP HERE TO CHANGE]', { fontFamily:'"Press Start 2P"', fontSize:'7px', color:GBS.dark }).setOrigin(0.5).setInteractive();
      chg.on('pointerdown', () => showNameEntry());
    }

    let blink = this.add.text(W/2, H*0.46, 'TAP TO START', { fontFamily:'"Press Start 2P"', fontSize:'14px', color:GBS.darkest }).setOrigin(0.5);
    this.tweens.add({ targets: blink, alpha: 0.2, duration: 500, yoyo: true, repeat: -1 });

    let lines = [
      'SHOOT TRADES WITH',
      'LHS OR RHS',
      '',
      'BIG SIZES = MORE HP',
      '',
      'AXED PAYER = POWERUP!',
    ];
    lines.forEach((l,i) => {
      this.add.text(W/2, H*0.54 + i*18, l, { fontFamily:'"Press Start 2P"', fontSize:'9px', color:GBS.dark }).setOrigin(0.5);
    });

    // High score
    let hi = 0; try { hi = parseInt(localStorage.getItem('stirboy_hi') || '0'); } catch(e){}
    if (hi > 0) {
      this.add.text(W/2, H*0.90, 'BEST: +' + (hi/1000).toFixed(1) + 'mio', { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.darkest }).setOrigin(0.5);
    }
    this.add.text(W/2, H*0.95, 'v2 PHASER', { fontFamily:'"Press Start 2P"', fontSize:'7px', color:GBS.dark }).setOrigin(0.5);

    this.input.once('pointerdown', (p) => {
      // Don't start if they tapped the change-name link area
      if (PLAYER_NAME && p.y > H*0.37 && p.y < H*0.42) return;
      this.startGame();
    });
    this.input.keyboard.once('keydown-ENTER', () => this.startGame());
  }

  startGame() {
    if (!PLAYER_NAME) {
      showNameEntry(() => this.scene.start('Game'));
    } else {
      this.scene.start('Game');
    }
  }

  update(time, delta) {
    let H = this.scale.height;
    this.dots.forEach(d => {
      d.y += 15 * (delta/1000);
      if (d.y > H + 4) { d.y = -4; d.x = ri(0, this.scale.width); }
    });
  }
}

// ---- GAME SCENE ----
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    this.W = this.scale.width;
    this.H = this.scale.height;

    this.score = 0; this.lives = 5; this.wave = 1;
    this.streak = 0; this.bestStreak = 0; this.missed = 0;
    this.waveKills = 0; this.waveTarget = 8;
    this.multiShot = 0; this.bulletCD = 0;
    this.tally = {};
    this.activeEvent = null;
    this.paused = false;
    this.thrusterTimer = 0;

    // Scrolling dots background
    this.bgDots = [];
    for (let i = 0; i < 25; i++) {
      let d = this.add.rectangle(ri(0,this.W), ri(0,this.H), 2, 2, GB.dark).setAlpha(0.25);
      this.bgDots.push(d);
    }

    // Groups
    this.invaders = this.add.group();
    this.bullets = this.add.group();
    this.powerups = this.add.group();

    // Player ship
    this.playerParts = [];
    this.player = this.add.rectangle(this.W/2, this.H - 28, 52, 22, GB.darkest);
    this.playerGun = this.add.rectangle(this.W/2, this.H - 44, 5, 16, GB.darkest);
    this.playerWingL = this.add.rectangle(this.W/2 - 30, this.H - 22, 10, 12, GB.darkest);
    this.playerWingR = this.add.rectangle(this.W/2 + 30, this.H - 22, 10, 12, GB.darkest);
    this.playerCockpit = this.add.rectangle(this.W/2, this.H - 30, 26, 10, GB.light);
    // Thruster glow
    this.thrusterL = this.add.rectangle(this.W/2 - 12, this.H - 15, 4, 8, GB.light).setAlpha(0.6);
    this.thrusterR = this.add.rectangle(this.W/2 + 12, this.H - 15, 4, 8, GB.light).setAlpha(0.6);

    // HUD - BIGGER fonts
    this.hudPnl = this.txt(4, 4, 'P&L:+0.0m', 13, GBS.darkest);
    this.hudWave = this.txt(this.W - 4, 4, 'W1', 11, GBS.dark).setOrigin(1, 0);
    this.hudName = this.txt(this.W/2, 4, PLAYER_NAME || 'SYDNEY', 9, GBS.dark).setOrigin(0.5, 0);
    this.hudStreak = this.txt(4, 22, '', 10, GBS.dark);
    this.hudMiss = this.txt(this.W/2, 18, '', 9, GBS.dark).setOrigin(0.5, 0);
    this.hudMulti = this.add.rectangle(0, 36, 0, 4, 0x2244aa).setOrigin(0, 0).setVisible(false);

    // Lives — little ship icons
    this.livesGfx = [];
    for (let i = 0; i < 5; i++) {
      let lx = this.W - 18 - i*18;
      let body = this.add.rectangle(lx, 22, 14, 10, GB.darkest);
      let gun = this.add.rectangle(lx, 16, 2, 6, GB.darkest);
      this.livesGfx.push({ body, gun });
    }

    // Event banner (bigger)
    this.bannerBg = this.add.rectangle(this.W/2, this.H*0.35, this.W, 52, GB.darkest).setAlpha(0).setDepth(10);
    this.bannerTxt = this.txt(this.W/2, this.H*0.35, '', 14, GBS.lightest).setOrigin(0.5, 0.5).setDepth(11).setAlpha(0);

    // Screen flash overlay (for events)
    this.flashOverlay = this.add.rectangle(this.W/2, this.H/2, this.W, this.H, 0xffffff).setAlpha(0).setDepth(9);

    // Event timer bar
    this.eventBar = this.add.rectangle(0, this.H - 5, 0, 5, GB.dark).setOrigin(0, 0);

    // Scanlines
    this.add.tileSprite(0, 0, this.W, this.H, 'scanlines').setOrigin(0).setDepth(50).setAlpha(0.4);

    // Tally overlay
    this.tallyBg = this.add.rectangle(this.W/2, this.H/2, this.W, this.H, 0x0f380f).setAlpha(0).setDepth(20);
    this.tallyTexts = [];

    // Spawn timers
    this.spawnTimer = this.time.addEvent({ delay: 2200, callback: this.spawnInvader, callbackScope: this, loop: true });
    this.eventClock = this.time.addEvent({ delay: 8000, callback: this.maybeEvent, callbackScope: this, loop: true });

    // Wave intro
    this.showWaveBanner(1);

    // Input
    this.moveLeft = false; this.moveRight = false;
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keyZ = this.input.keyboard.addKey('Z');
    this.keyX = this.input.keyboard.addKey('X');
    this.keySpace = this.input.keyboard.addKey('SPACE');
    this.keyP = this.input.keyboard.addKey('P');
    this.keyP.on('down', () => this.toggleTally());
  }

  txt(x, y, str, size, color) {
    return this.add.text(x, y, str, { fontFamily: '"Press Start 2P"', fontSize: size + 'px', color: color });
  }

  showWaveBanner(n) {
    let label = WAVE_LABELS[Math.min(n-1, WAVE_LABELS.length-1)];
    this.bannerTxt.setText('WAVE ' + n + '\n' + label);
    this.bannerBg.setAlpha(0.92);
    this.bannerTxt.setAlpha(1);
    this.tweens.add({ targets: [this.bannerBg, this.bannerTxt], alpha: 0, delay: 1800, duration: 600 });
  }

  showBanner(msg) {
    this.bannerTxt.setText(msg);
    this.bannerBg.setAlpha(0.9);
    this.bannerTxt.setAlpha(1);
    // Screen flash
    this.flashOverlay.setAlpha(0.25);
    this.tweens.add({ targets: this.flashOverlay, alpha: 0, duration: 400 });
    this.tweens.add({ targets: [this.bannerBg, this.bannerTxt], alpha: 0, delay: 1600, duration: 500 });
  }

  // ---- SPAWNING ----
  spawnInvader() {
    if (this.paused) return;
    let tc, size;

    if (this.activeEvent && this.activeEvent.fx === 'steep') {
      tc = rEl(LONG_TENORS);
      size = ri(tc.min/50, Math.min(tc.max*2, 2000)/50) * 50;
    } else if (this.activeEvent && this.activeEvent.fx === 'small') {
      tc = rEl(ALL_TENORS);
      size = ri(1, 4) * 50;
    } else {
      tc = rEl(ALL_TENORS);
      size = ri(tc.min/50, tc.max/50) * 50;
    }

    let ccy = rEl(CCYS);
    let baseSpd = 42 + this.wave * 5;
    if (this.activeEvent) {
      if (this.activeEvent.fx === 'accel' || this.activeEvent.fx === 'steep') baseSpd *= 1.5;
      if (this.activeEvent.fx === 'slow') baseSpd *= 0.4;
    }

    let hp = hpFor(size);
    let invW = Math.min(this.W * 0.42, 150);
    let x = ri(invW/2 + 4, this.W - invW/2 - 4);

    let bg = this.add.rectangle(x, -34, invW, 42, GB.darkest);
    let border = this.add.rectangle(x, -34, invW-2, 40).setStrokeStyle(1, GB.dark).setFillStyle();
    let label = this.txt(x - invW/2 + 8, -48, ccy + ' ' + tc.tenor, 11, GBS.bg);
    let sizeLabel = this.txt(x - invW/2 + 8, -34, fmtSize(size), 10, GBS.light);

    // HP bar
    let hpBgBar = this.add.rectangle(x, -16, invW - 8, 5, 0x663333);
    let hpBar = this.add.rectangle(x - (invW-8)/2, -16, invW - 8, 5, 0x44cc44).setOrigin(0, 0.5);

    let inv = { bg, border, label, sizeLabel, hpBgBar, hpBar, ccy, tenor: tc.tenor, size, hp, maxHp: hp,
                x, y: -34, w: invW, speed: baseSpd + Math.random()*20, alive: true, spawnTime: this.time.now };

    // Entry tween — slide in and settle
    bg.setScale(0.8); border.setScale(0.8);
    this.tweens.add({ targets: [bg, border], scale: 1, duration: 200, ease: 'Back.easeOut' });

    // Blink effect for excess bill supply
    if (this.activeEvent && this.activeEvent.fx === 'blink') {
      this.tweens.add({ targets: [bg, border], alpha: { from: 1, to: 0.15 }, duration: 120, yoyo: true, repeat: -1 });
    }

    this.invaders.add(bg);
    bg._inv = inv;
    bg._parts = [border, label, sizeLabel, hpBgBar, hpBar];
  }

  spawnPowerup() {
    if (this.paused) return;
    let x = ri(50, this.W - 50);
    let pw_w = Math.min(this.W*0.38, 140);
    let bg = this.add.rectangle(x, -28, pw_w, 36, 0xddaa00);
    let border = this.add.rectangle(x, -28, pw_w - 4, 32).setStrokeStyle(2, 0xffee44).setFillStyle();
    let label = this.txt(x - pw_w/2 + 10, -36, 'AXED PAYER!', 10, '#fff');
    this.tweens.add({ targets: [bg, border], alpha: { from: 1, to: 0.4 }, duration: 250, yoyo: true, repeat: -1 });

    let pw = { bg, border, label, x, y: -28, alive: true, speed: 32, w: pw_w };
    this.powerups.add(bg);
    bg._pw = pw;
    bg._parts = [border, label];
  }

  spawnOMO() {
    let tc = rEl(ON_TENORS);
    let size = ri(30, 40) * 50;
    let hp = 8;
    let invW = Math.min(this.W * 0.48, 170);
    let x = ri(invW/2 + 4, this.W - invW/2 - 4);

    let bg = this.add.rectangle(x, -44, invW, 48, 0x0f380f).setStrokeStyle(3, 0x8bac0f);
    let label = this.txt(x - invW/2 + 10, -58, 'AUD ' + tc.tenor, 12, GBS.lightest);
    let sizeLabel = this.txt(x - invW/2 + 10, -42, fmtSize(size), 11, GBS.lightest);
    let hpBgBar = this.add.rectangle(x, -22, invW - 8, 6, 0x663333);
    let hpBar = this.add.rectangle(x - (invW-8)/2, -22, invW - 8, 6, 0xcc4444).setOrigin(0, 0.5);

    // Pulse glow on OMO invaders
    this.tweens.add({ targets: bg, alpha: { from: 1, to: 0.7 }, duration: 400, yoyo: true, repeat: -1 });

    let inv = { bg, label, sizeLabel, hpBgBar, hpBar, ccy:'AUD', tenor:tc.tenor, size, hp, maxHp:hp,
                x, y:-44, w:invW, speed:18, alive:true, spawnTime:this.time.now };

    this.invaders.add(bg);
    bg._inv = inv;
    bg._parts = [label, sizeLabel, hpBgBar, hpBar];
  }

  // ---- EVENTS ----
  maybeEvent() {
    if (this.paused || this.activeEvent) return;
    if (Math.random() < 0.4 + this.wave * 0.05) this.triggerEvent();
  }

  triggerEvent() {
    let evt = rEl(EVENTS);
    this.activeEvent = { ...evt, endTime: this.time.now + evt.dur };
    this.showBanner(evt.name);

    if (evt.fx === 'flood') {
      for (let i = 0; i < 5; i++) this.time.delayedCall(i * 200, () => this.spawnInvader());
    }
    if (evt.fx === 'omo') {
      for (let i = 0; i < 3; i++) this.time.delayedCall(i * 600, () => this.spawnOMO());
    }
    if (evt.fx === 'quake') this.cameras.main.shake(4000, 0.012);
    if (evt.fx === 'chaos') this.cameras.main.shake(3000, 0.009);
    if (Math.random() < 0.3) this.spawnPowerup();
    this.time.delayedCall(evt.dur, () => { this.activeEvent = null; });
  }

  // ---- SHOOTING ----
  fire(isLHS) {
    if (this.paused) return;
    if (this.bulletCD > 0) return;

    let px = this.player.x, py = this.player.y - 20;
    let col = isLHS ? 0xcc2222 : 0x2255cc;

    if (this.multiShot > 0) {
      this.bulletCD = 80;
      for (let off of [-16, 0, 16]) {
        let b = this.add.rectangle(px + off, py, 5, 14, col);
        // Bullet glow trail
        let trail = this.add.rectangle(px + off, py + 10, 3, 8, col).setAlpha(0.4);
        b._bul = { isLHS, alive: true, trail };
        this.bullets.add(b);
      }
    } else {
      this.bulletCD = 180;
      let b = this.add.rectangle(px, py, 5, 14, col);
      let trail = this.add.rectangle(px, py + 10, 3, 8, col).setAlpha(0.4);
      b._bul = { isLHS, alive: true, trail };
      this.bullets.add(b);
    }
  }

  // ---- TALLY ----
  toggleTally() {
    this.paused = !this.paused;
    if (this.paused) {
      this.spawnTimer.paused = true;
      this.eventClock.paused = true;
      this.showTallyScreen();
    } else {
      this.spawnTimer.paused = false;
      this.eventClock.paused = false;
      this.hideTallyScreen();
    }
  }

  showTallyScreen() {
    this.tallyBg.setAlpha(0.94).setDepth(20);
    this.tallyTexts.forEach(t => t.destroy());
    this.tallyTexts = [];

    let y = 16;
    let push = (x, yy, str, sz, col, ox) => {
      let t = this.txt(x, yy, str, sz, col).setDepth(21);
      if (ox !== undefined) t.setOrigin(ox, 0);
      this.tallyTexts.push(t);
      return t;
    };

    push(this.W/2, y, 'TALLY / P&L', 15, GBS.lightest, 0.5); y += 32;
    push(this.W/2, y, (PLAYER_NAME || 'TRADER') + ' @ SYDNEY', 9, GBS.light, 0.5); y += 20;
    push(this.W/2, y, 'P&L: +' + (this.score/1000).toFixed(1) + 'mio', 13, GBS.lightest, 0.5); y += 24;
    push(this.W/2, y, 'W' + this.wave + '  STREAK ' + this.bestStreak + '  MISS ' + this.missed, 9, GBS.light, 0.5); y += 28;

    let ccyList = Object.keys(this.tally);
    if (ccyList.length > 0) {
      push(this.W/2, y, '-- HEDGE BOOK --', 10, GBS.light, 0.5); y += 22;
      push(10, y, 'CCY  LHS RHS  VOL', 9, GBS.light); y += 18;

      let totL=0, totR=0, totV=0;
      ccyList.forEach(ccy => {
        let t = this.tally[ccy]; totL+=t.lhs; totR+=t.rhs; totV+=t.vol;
        push(10, y, ccy+'  '+t.lhs+'   '+t.rhs+'   '+fmtSize(t.vol), 9, GBS.lightest); y += 17;
      });
      y += 6;
      push(10, y, 'TOT  '+totL+'   '+totR+'   '+fmtSize(totV), 9, GBS.light);
    } else {
      push(this.W/2, y, 'NO TRADES YET', 10, GBS.light, 0.5);
    }
  }

  hideTallyScreen() {
    this.tallyBg.setAlpha(0);
    this.tallyTexts.forEach(t => t.destroy());
    this.tallyTexts = [];
  }

  // ---- HIT FX ----
  spawnHitFx(x, y, color, count) {
    count = count || 8;
    for (let i = 0; i < count; i++) {
      let sz = ri(3, 7);
      let p = this.add.rectangle(x, y, sz, sz, color);
      let angle = Math.random() * Math.PI * 2;
      let dist = 30 + Math.random() * 60;
      this.tweens.add({
        targets: p, x: x + Math.cos(angle)*dist, y: y + Math.sin(angle)*dist,
        alpha: 0, scale: 0, rotation: Math.random()*3,
        duration: 300 + Math.random()*300, onComplete: () => p.destroy()
      });
    }
  }

  // ---- UPDATE ----
  update(time, delta) {
    if (this.paused) return;

    this.bulletCD = Math.max(0, this.bulletCD - delta);
    if (this.multiShot > 0) this.multiShot -= delta;

    // Scrolling bg dots
    this.bgDots.forEach(d => {
      d.y += 20 * (delta/1000);
      if (d.y > this.H + 4) { d.y = -4; d.x = ri(0, this.W); }
    });

    // Thruster animation
    this.thrusterTimer += delta;
    let tFlicker = Math.sin(this.thrusterTimer * 0.02) * 0.3 + 0.5;
    this.thrusterL.setAlpha(tFlicker);
    this.thrusterR.setAlpha(tFlicker);
    let tLen = 6 + Math.sin(this.thrusterTimer * 0.015) * 4;
    this.thrusterL.setSize(4, tLen);
    this.thrusterR.setSize(4, tLen);

    // Input
    let ml = this.moveLeft || this.cursors.left.isDown;
    let mr = this.moveRight || this.cursors.right.isDown;
    let spd = 220 * (delta / 1000);
    if (ml) this.movePlayer(-spd);
    if (mr) this.movePlayer(spd);

    if (Phaser.Input.Keyboard.JustDown(this.keyZ) || Phaser.Input.Keyboard.JustDown(this.keySpace)) this.fire(true);
    if (Phaser.Input.Keyboard.JustDown(this.keyX)) this.fire(false);

    // Multi-shot bar
    if (this.multiShot > 0) {
      this.hudMulti.setVisible(true).setSize(this.W * (this.multiShot / 6000), 4);
    } else {
      this.hudMulti.setVisible(false);
    }

    // Event bar
    if (this.activeEvent) {
      let remain = Math.max(0, this.activeEvent.endTime - time);
      this.eventBar.setSize(this.W * (remain / this.activeEvent.dur), 5);
    } else {
      this.eventBar.setSize(0, 5);
    }

    // Move bullets
    this.bullets.getChildren().slice().forEach(b => {
      if (!b._bul || !b._bul.alive) return;
      b.y -= 420 * (delta / 1000);
      if (b._bul.trail) { b._bul.trail.x = b.x; b._bul.trail.y = b.y + 12; }
      if (b.y < -20) { b._bul.alive = false; if (b._bul.trail) b._bul.trail.destroy(); b.destroy(); }
    });

    // Move powerups
    this.powerups.getChildren().slice().forEach(bg => {
      let pw = bg._pw; if (!pw || !pw.alive) return;
      pw.y += pw.speed * (delta / 1000);
      bg.y = pw.y;
      bg._parts.forEach(p => p.y += pw.speed * (delta/1000));
      if (pw.y > this.H + 30) { pw.alive = false; bg.destroy(); bg._parts.forEach(p=>p.destroy()); }

      this.bullets.getChildren().slice().forEach(bb => {
        if (!bb._bul || !bb._bul.alive || !pw.alive) return;
        if (Math.abs(bb.x - bg.x) < pw.w/2 + 5 && Math.abs(bb.y - bg.y) < 22) {
          bb._bul.alive = false; if (bb._bul.trail) bb._bul.trail.destroy(); bb.destroy();
          pw.alive = false; bg.destroy(); bg._parts.forEach(p=>p.destroy());
          this.multiShot = 6000;
          this.showBanner('AXED PAYER!\nTRIPLE SHOT!');
          this.spawnHitFx(pw.x, pw.y, 0xffcc00, 15);
          this.cameras.main.flash(200, 255, 200, 0);
        }
      });
    });

    // Move invaders
    let wobbly = this.activeEvent && this.activeEvent.fx === 'wobbly';
    this.invaders.getChildren().slice().forEach(bg => {
      let inv = bg._inv; if (!inv || !inv.alive) return;
      inv.y += inv.speed * (delta / 1000);

      let xOff = 0;
      if (wobbly) xOff = Math.sin((time - inv.spawnTime) * 0.004) * 35;

      bg.x = inv.x + xOff; bg.y = inv.y;
      // Update all parts positions
      let parts = bg._parts || [];
      if (inv.border) { inv.border.x = inv.x + xOff; inv.border.y = inv.y; }
      if (parts[0]) { parts[0].x = inv.x + xOff; parts[0].y = inv.y; } // border
      if (parts[1]) parts[1].setPosition(inv.x - inv.w/2 + 8 + xOff, inv.y - 14);  // label
      if (parts[2]) parts[2].setPosition(inv.x - inv.w/2 + 8 + xOff, inv.y + 0);   // size
      if (inv.hpBgBar) inv.hpBgBar.setPosition(inv.x + xOff, inv.y + 17);
      if (inv.hpBar) {
        inv.hpBar.setPosition(inv.x - (inv.w-8)/2 + xOff, inv.y + 17);
        inv.hpBar.setSize((inv.w - 8) * (inv.hp / inv.maxHp), inv.hpBar.height);
      }

      // Hit player?
      if (inv.y > this.H - 46 && inv.y < this.H - 10 &&
          Math.abs((inv.x + xOff) - this.player.x) < (inv.w/2 + 26)) {
        this.spawnHitFx(this.player.x, this.player.y, 0xcc2222, 12);
        this.killInvader(inv, bg);
        this.lives--;
        this.streak = 0;
        this.updateLives();
        this.showBanner('FILLED! OUCH!');
        this.cameras.main.shake(400, 0.025);
        this.cameras.main.flash(200, 200, 50, 50);
        if (this.lives <= 0) { this.gameOver(); return; }
        return;
      }

      // Off screen?
      if (inv.y > this.H + 30) {
        this.killInvader(inv, bg);
        this.missed++; this.streak = 0;
        this.hudMiss.setText('MISS:' + this.missed);
        let taunt = this.txt(this.W/2, this.H - 50, rEl(MISS_TAUNTS), 10, '#883322').setOrigin(0.5,0.5);
        this.tweens.add({ targets: taunt, y: this.H - 90, alpha: 0, duration: 1200, onComplete: () => taunt.destroy() });
      }

      // Bullet collision
      this.bullets.getChildren().slice().forEach(bb => {
        if (!bb._bul || !bb._bul.alive || !inv.alive) return;
        if (Math.abs(bb.x - (inv.x + xOff)) < inv.w/2 + 4 && Math.abs(bb.y - inv.y) < 24) {
          bb._bul.alive = false; if (bb._bul.trail) bb._bul.trail.destroy(); bb.destroy();
          inv.hp--;
          if (inv.hp <= 0) {
            // KILLED
            this.streak++; if (this.streak > this.bestStreak) this.bestStreak = this.streak;
            let mult = Math.min(this.streak, 10);
            let pts = Math.floor(inv.size / 10) * mult;
            this.score += pts;
            this.waveKills++;

            let side = bb._bul.isLHS ? 'lhs' : 'rhs';
            if (!this.tally[inv.ccy]) this.tally[inv.ccy] = { lhs:0, rhs:0, vol:0 };
            this.tally[inv.ccy][side]++;
            this.tally[inv.ccy].vol += inv.size;

            this.spawnHitFx(inv.x + xOff, inv.y, GB.light, 10);

            // Score popup with bounce
            let ft = this.txt(inv.x + xOff, inv.y - 10, '+' + pts, 13, GBS.darkest).setOrigin(0.5,0.5);
            ft.setScale(1.4);
            this.tweens.add({ targets: ft, scale: 1, duration: 150 });
            this.tweens.add({ targets: ft, y: inv.y - 60, alpha: 0, duration: 900, onComplete: () => ft.destroy() });

            // Streak callout
            if (this.streak >= 5 && this.streak % 5 === 0) {
              let sc = this.txt(this.W/2, this.H*0.6, this.streak + 'x STREAK!', 14, GBS.darkest).setOrigin(0.5,0.5);
              sc.setScale(0.5);
              this.tweens.add({ targets: sc, scale: 1.2, duration: 200, yoyo: true });
              this.tweens.add({ targets: sc, alpha: 0, y: this.H*0.5, delay: 600, duration: 400, onComplete: () => sc.destroy() });
            }

            this.killInvader(inv, bg);
            this.updateHUD();

            if (this.waveKills >= this.waveTarget) {
              this.wave++; this.waveKills = 0; this.waveTarget = 8 + this.wave * 2;
              this.showWaveBanner(this.wave);
              this.spawnTimer.delay = Math.max(800, 2200 - this.wave * 150);
              // Flash on wave change
              this.cameras.main.flash(300, 15, 56, 15);
            }
          } else {
            // Hit but not dead
            this.tweens.add({ targets: bg, alpha: { from: 0.2, to: 1 }, duration: 100 });
            this.spawnHitFx(bb.x, bb.y, GB.light, 4);
            let ht = this.txt(inv.x + xOff, inv.y - 18, inv.hp + ' LEFT', 9, GBS.darkest).setOrigin(0.5,0.5);
            this.tweens.add({ targets: ht, y: inv.y - 44, alpha: 0, duration: 600, onComplete: () => ht.destroy() });
          }
        }
      });
    });

    this.updateHUD();
  }

  movePlayer(dx) {
    let nx = Phaser.Math.Clamp(this.player.x + dx, 30, this.W - 30);
    this.player.x = nx;
    this.playerGun.x = nx;
    this.playerWingL.x = nx - 30;
    this.playerWingR.x = nx + 30;
    this.playerCockpit.x = nx;
    this.thrusterL.x = nx - 12;
    this.thrusterR.x = nx + 12;
  }

  killInvader(inv, bg) {
    inv.alive = false;
    bg.destroy();
    if (bg._parts) bg._parts.forEach(p => { try { p.destroy(); } catch(e){} });
  }

  updateHUD() {
    this.hudPnl.setText('P&L:+' + (this.score/1000).toFixed(1) + 'm');
    this.hudWave.setText('W' + this.wave);
    this.hudStreak.setText(this.streak > 1 ? 'x' + this.streak : '');
  }

  updateLives() {
    this.livesGfx.forEach((g, i) => {
      let vis = i < this.lives;
      g.body.setVisible(vis);
      g.gun.setVisible(vis);
    });
  }

  gameOver() {
    let hi = 0;
    try { hi = parseInt(localStorage.getItem('stirboy_hi') || '0'); } catch(e){}
    if (this.score > hi) { try { localStorage.setItem('stirboy_hi', this.score.toString()); } catch(e){} }
    this.scene.start('GameOver', {
      score: this.score, wave: this.wave, streak: this.bestStreak,
      missed: this.missed, tally: this.tally, hi: Math.max(this.score, hi), name: PLAYER_NAME
    });
  }
}

// ---- GAME OVER SCENE ----
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }
  create(data) {
    let W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor(GB.bg);

    // Scanlines
    this.add.tileSprite(0, 0, W, H, 'scanlines').setOrigin(0).setDepth(50).setAlpha(0.4);

    // Panel
    this.add.rectangle(W/2, H/2, W*0.94, H*0.88, GB.darkest).setStrokeStyle(3, GB.light);

    let y = H*0.08;
    this.add.text(W/2, y, 'BLOWN UP!', { fontFamily:'"Press Start 2P"', fontSize:'20px', color:GBS.lightest }).setOrigin(0.5);
    y += 38;

    if (data.name) {
      this.add.text(W/2, y, data.name + ' @ SYDNEY', { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.light }).setOrigin(0.5);
      y += 22;
    }

    this.add.text(W/2, y, 'P&L: +' + (data.score/1000).toFixed(1) + 'mio', { fontFamily:'"Press Start 2P"', fontSize:'14px', color:GBS.lightest }).setOrigin(0.5);
    y += 28;
    this.add.text(W/2, y, 'WAVE '+data.wave+'  STREAK '+data.streak, { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.light }).setOrigin(0.5);
    y += 20;
    this.add.text(W/2, y, 'MISSED: '+data.missed, { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.light }).setOrigin(0.5);
    y += 28;

    let ccyList = Object.keys(data.tally || {});
    if (ccyList.length) {
      this.add.text(W/2, y, '-- HEDGE BOOK --', { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.light }).setOrigin(0.5);
      y += 20;
      let totL=0,totR=0,totV=0;
      ccyList.forEach(ccy => {
        let t = data.tally[ccy]; totL+=t.lhs; totR+=t.rhs; totV+=t.vol;
        this.add.text(14, y, ccy+'  L:'+t.lhs+' R:'+t.rhs+' '+fmtSize(t.vol), { fontFamily:'"Press Start 2P"', fontSize:'9px', color:GBS.lightest });
        y += 16;
      });
      y += 6;
      this.add.text(14, y, 'TOT L:'+totL+' R:'+totR+' '+fmtSize(totV), { fontFamily:'"Press Start 2P"', fontSize:'9px', color:GBS.light });
      y += 24;
    }

    if (data.score >= data.hi) {
      let nt = this.add.text(W/2, y, 'NEW HIGH SCORE!', { fontFamily:'"Press Start 2P"', fontSize:'11px', color:'#ffcc00' }).setOrigin(0.5);
      this.tweens.add({ targets: nt, scale: { from: 1, to: 1.15 }, duration: 400, yoyo: true, repeat: -1 });
    }

    let cont = this.add.text(W/2, H*0.90, 'TAP TO CONTINUE', { fontFamily:'"Press Start 2P"', fontSize:'10px', color:GBS.lightest }).setOrigin(0.5);
    this.tweens.add({ targets: cont, alpha: 0, duration: 500, yoyo: true, repeat: -1 });

    this.input.once('pointerdown', () => this.scene.start('Title'));
    this.input.keyboard.once('keydown-ENTER', () => this.scene.start('Title'));
  }
}

// ---- NAME ENTRY ----
let nameCallback = null;

function showNameEntry(cb) {
  nameCallback = cb || null;
  let overlay = document.getElementById('nameOverlay');
  let input = document.getElementById('nameInput');
  overlay.classList.add('show');
  input.value = PLAYER_NAME;
  input.focus();
}

document.getElementById('nameOk').addEventListener('click', submitName);
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });

function submitName() {
  let input = document.getElementById('nameInput');
  let name = input.value.trim().toUpperCase().replace(/[^A-Z0-9 ]/g, '').substring(0, 8);
  if (!name) name = 'TRADER';
  PLAYER_NAME = name;
  try { localStorage.setItem('stirboy_name', name); } catch(e){}
  document.getElementById('nameOverlay').classList.remove('show');
  if (nameCallback) { nameCallback(); nameCallback = null; }
}

// ---- INIT ----
function initGame() {
  let container = document.getElementById('game-container');
  let rect = container.getBoundingClientRect();

  let game = new Phaser.Game({
    type: Phaser.AUTO,
    width: Math.floor(rect.width),
    height: Math.floor(rect.height),
    parent: 'game-container',
    backgroundColor: '#9bbc0f',
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [BootScene, TitleScene, GameScene, GameOverScene],
  });

  // Wire up HTML buttons
  function setupHold(id, down, up) {
    let el = document.getElementById(id); if (!el) return;
    let h = false;
    el.addEventListener('touchstart', e => { e.preventDefault(); h=true; down(); }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); h=false; up(); }, {passive:false});
    el.addEventListener('touchcancel', e => { e.preventDefault(); h=false; up(); }, {passive:false});
    el.addEventListener('mousedown', e => { e.preventDefault(); h=true; down(); });
    el.addEventListener('mouseup', e => { e.preventDefault(); h=false; up(); });
    el.addEventListener('mouseleave', () => { if(h){h=false;up();} });
  }
  function setupTap(id, fn) {
    let el = document.getElementById(id); if (!el) return;
    el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false});
    el.addEventListener('mousedown', e => { e.preventDefault(); fn(); });
  }

  function getScene() { return game.scene.getScene('Game'); }

  setupHold('dLeft',
    () => { let s = getScene(); if(s) s.moveLeft = true; },
    () => { let s = getScene(); if(s) s.moveLeft = false; }
  );
  setupHold('dRight',
    () => { let s = getScene(); if(s) s.moveRight = true; },
    () => { let s = getScene(); if(s) s.moveRight = false; }
  );
  setupTap('btnLHS', () => { let s = getScene(); if(s) s.fire(true); });
  setupTap('btnRHS', () => { let s = getScene(); if(s) s.fire(false); });

  document.getElementById('btnTally').addEventListener('click', () => {
    let s = getScene(); if(s && s.scene.isActive()) s.toggleTally();
  });
  document.getElementById('btnStart').addEventListener('click', () => {
    let s = getScene();
    if (s && s.paused) { s.toggleTally(); return; }
    let title = game.scene.getScene('Title');
    if (title && title.scene.isActive()) title.scene.start('Game');
    let go = game.scene.getScene('GameOver');
    if (go && go.scene.isActive()) go.scene.start('Title');
  });

  document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
}

document.fonts.ready.then(initGame);
</script>
</body>
</html>
