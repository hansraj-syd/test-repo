<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>STIRBoy Tomnexter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: #3a3a5c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #gameboy {
    background: linear-gradient(145deg, #c8c8c8 0%, #a8a8a8 50%, #989898 100%);
    border-radius: 16px 16px 80px 16px;
    padding: 10px 10px 14px;
    width: 100%;
    height: 100%;
    max-width: 500px;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 4px 4px 0 #666, inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
  }

  .top-brand {
    color: #6a6a8a;
    font-size: 7px;
    letter-spacing: 3px;
    margin-bottom: 3px;
    text-align: center;
  }

  #screen-bezel {
    background: #4a4a6a;
    border-radius: 8px;
    padding: 6px 6px 4px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .screen-label {
    color: #8888aa;
    font-size: 5px;
    text-align: left;
    margin-bottom: 2px;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
  }

  .screen-label .dot {
    width: 6px; height: 6px;
    background: #c03030;
    border-radius: 50%;
    display: inline-block;
    box-shadow: inset -1px -1px 0 rgba(0,0,0,0.3);
  }

  #gameCanvas {
    width: 100%;
    flex: 1;
    display: block;
    background: #9bbc0f;
    border-radius: 4px;
    image-rendering: pixelated;
  }

  .screen-bottom-label {
    color: #8888aa;
    font-size: 4px;
    text-align: center;
    margin-top: 2px;
    letter-spacing: 4px;
  }

  /* Controls - simplified: big arrows + big fire buttons */
  #controls {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 8px 4px;
    flex-shrink: 0;
    gap: 8px;
  }

  .arrow-btn {
    width: 70px;
    height: 70px;
    background: #2d2d2d;
    border: none;
    color: #ccc;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 12px;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .arrow-btn:active {
    background: #505050;
    color: #fff;
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }

  .fire-area {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .fire-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.4);
    color: #fff;
  }

  .fire-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  .btn-lhs { background: #c02020; }
  .btn-rhs { background: #2050c0; }

  /* Meta buttons */
  .meta-buttons {
    display: flex;
    gap: 20px;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .meta-btn {
    width: 52px;
    height: 14px;
    border-radius: 7px;
    border: none;
    background: #777;
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    color: #444;
    cursor: pointer;
    transform: rotate(-8deg);
    -webkit-tap-highlight-color: transparent;
  }
  .meta-btn:active { background: #999; }

  /* Speaker */
  .speaker {
    position: absolute;
    bottom: 18px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transform: rotate(-25deg);
  }
  .speaker-line {
    width: 24px; height: 2px;
    background: #888;
    border-radius: 1px;
  }

  /* Responsive */
  @media (max-height: 600px) {
    #gameboy { padding: 4px 6px 8px; border-radius: 10px 10px 50px 10px; }
    #screen-bezel { padding: 3px 5px 3px; }
    .arrow-btn { width: 56px; height: 56px; font-size: 24px; }
    .fire-btn { width: 58px; height: 58px; font-size: 8px; }
    #controls { padding: 6px 4px 2px; }
    .meta-buttons { margin-top: 2px; }
  }

  @media (min-height: 800px) {
    .arrow-btn { width: 80px; height: 80px; font-size: 36px; border-radius: 14px; }
    .fire-btn { width: 82px; height: 82px; font-size: 11px; }
  }

  @media (min-height: 900px) {
    .arrow-btn { width: 88px; height: 88px; font-size: 40px; }
    .fire-btn { width: 90px; height: 90px; font-size: 12px; }
    #controls { padding: 14px 10px 6px; gap: 12px; }
  }
</style>
</head>
<body>

<div id="gameboy">
  <div class="top-brand">STIRBoy&trade; TOMNEXTER</div>

  <div id="screen-bezel">
    <div class="screen-label">
      <span><span class="dot"></span> POWER</span>
      <span>STIRBOY TOMNEXTER</span>
    </div>
    <canvas id="gameCanvas" width="400" height="360"></canvas>
    <div class="screen-bottom-label">&copy; 2026 TOMNEXTER SYSTEMS</div>
  </div>

  <div class="meta-buttons">
    <button class="meta-btn" id="btnPause">PAUSE</button>
    <button class="meta-btn" id="btnStart">START</button>
  </div>

  <div id="controls">
    <button class="arrow-btn" id="dLeft">&#9664;</button>
    <button class="arrow-btn" id="dRight">&#9654;</button>

    <div class="fire-area">
      <button class="fire-btn btn-rhs" id="btnRHS">RHS<br>BUY</button>
      <button class="fire-btn btn-lhs" id="btnLHS">LHS<br>SELL</button>
    </div>
  </div>

  <div class="speaker">
    <div class="speaker-line"></div>
    <div class="speaker-line"></div>
    <div class="speaker-line"></div>
    <div class="speaker-line"></div>
    <div class="speaker-line"></div>
    <div class="speaker-line"></div>
  </div>
</div>

<script>
// =============================================
// STIRBoy Tomnexter - FX Trading Arcade
// =============================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Resize canvas — use CSS pixel size (NOT devicePixelRatio)
// so fonts render at the right visible size
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width);
  canvas.height = Math.floor(rect.height);
  game.player.y = canvas.height - 40;
  game.player.x = Math.min(game.player.x, canvas.width - game.player.w);
}
window.addEventListener('resize', resizeCanvas);

// Game Boy palette
const GB = {
  darkest:  '#0f380f',
  dark:     '#306230',
  light:    '#8bac0f',
  lightest: '#9bbc0f',
  bg:       '#9bbc0f',
};

const CCYS = ['AUD','NZD','JPY','CHF','EUR','CAD','GBP'];

const TENOR_WAVES = [
  { tenors: ['T/N','S/N','1W'], minSize: 500, maxSize: 2000, speed: 1.8, label: 'SHORT DATES' },
  { tenors: ['2W','1M','2M'], minSize: 500, maxSize: 1000, speed: 1.4, label: 'MEDIUM TENORS' },
  { tenors: ['3M','6M'], minSize: 200, maxSize: 500, speed: 1.1, label: 'MEDIUM-LONG' },
  { tenors: ['9M','1Y','2Y'], minSize: 50, maxSize: 500, speed: 0.8, label: 'LONG DATES' },
];

const MISS_TAUNTS = [
  'MISSED! TOO SLOW!',
  'THAT ONE GOT AWAY!',
  'CLIENT NOT HAPPY!',
  'SALES ON LINE 2...',
  'BROKER IS LAUGHING',
  'SHOULDA HEDGED THAT',
  'SLIPPED THROUGH!',
  'OFF THE RUN!',
  'TICKET DROPPED!',
  'ASLEEP AT THE DESK?',
  'WHERE WERE YOU?!',
  'NICE ONE CHAMP...',
];

const EVENTS = [
  { name: 'NFP RELEASE!', effect: 'speedup', duration: 300 },
  { name: 'CPI PRINT!', effect: 'speedup', duration: 300 },
  { name: 'FOMC DECISION!', effect: 'chaos', duration: 400 },
  { name: 'O/N CUTOFF!', effect: 'flood', duration: 250 },
  { name: 'SYD>LDN HANDOVER', effect: 'shift', duration: 200 },
  { name: 'LDN>NY HANDOVER', effect: 'shift', duration: 200 },
  { name: 'BASIS BLOW-OUT!', effect: 'split', duration: 350 },
  { name: 'FUNDING SQUEEZE!', effect: 'accel', duration: 300 },
  { name: 'YEAR-END TURN!', effect: 'boss', duration: 500 },
];

let game = {
  state: 'title',
  score: 0,
  lives: 5,
  wave: 1,
  streak: 0,
  bestStreak: 0,
  missed: 0,
  player: { x: 200, y: 310, w: 36, h: 14, speed: 4 },
  invaders: [],
  bullets: [],
  particles: [],
  floatTexts: [],
  event: null,
  eventTimer: 0,
  spawnTimer: 0,
  spawnRate: 90,
  waveKills: 0,
  waveTarget: 10,
  keys: { left: false, right: false },
  highScore: parseInt(localStorage.getItem('stirboy_hi') || '0'),
  flashTimer: 0,
  flashMsg: '',
  titleAnim: 0,
  sessionCity: 'SYDNEY',
  bulletCooldown: 0,
};

function formatSize(mio) {
  if (mio >= 1000) return (mio/1000).toFixed(1) + 'bn';
  return mio + 'mio';
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randEl(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getWaveConfig() {
  return TENOR_WAVES[Math.min(Math.floor((game.wave - 1) / 2), TENOR_WAVES.length - 1)];
}

function addFloatText(x, y, text, good) {
  game.floatTexts.push({ x, y, text, good, life: 70, startY: y });
}

function spawnInvader() {
  let cfg = getWaveConfig();
  let ccy = randEl(CCYS);
  let tenor = randEl(cfg.tenors);
  let size = randInt(cfg.minSize / 50, cfg.maxSize / 50) * 50;
  let isLHS = Math.random() < 0.5;
  let speedMult = 1 + (game.wave - 1) * 0.06;
  let eventSpeedMult = 1;

  if (game.event) {
    if (game.event.effect === 'speedup' || game.event.effect === 'chaos') eventSpeedMult = 1.5;
    if (game.event.effect === 'accel') eventSpeedMult = 1.8;
    if (game.event.effect === 'boss') eventSpeedMult = 1.6;
  }
  if (game.event && game.event.effect === 'accel') size = Math.min(size * 2, 2000);

  let invW = Math.min(canvas.width - 20, 140);
  let x = randInt(5, canvas.width - invW - 5);

  return {
    x, y: -36,
    w: invW, h: 36,
    speed: cfg.speed * speedMult * eventSpeedMult * (0.85 + Math.random() * 0.3),
    ccy, tenor, size, isLHS,
    alive: true, flash: 0,
    hp: game.wave > 8 ? 2 : 1,
  };
}

function fireBullet(isLHS) {
  if (game.state === 'title') { resetGame(); return; }
  if (game.state === 'gameover') { game.state = 'title'; return; }
  if (game.state !== 'playing') return;
  if (game.bulletCooldown > 0) return;
  game.bulletCooldown = 8;
  game.bullets.push({
    x: game.player.x + game.player.w / 2 - 2,
    y: game.player.y - 4,
    w: 4, h: 10, speed: 7, isLHS, alive: true,
  });
}

function triggerEvent() {
  let evt = randEl(EVENTS);
  game.event = { ...evt };
  game.eventTimer = evt.duration;
  game.flashMsg = evt.name;
  game.flashTimer = 90;

  if (evt.effect === 'flood') {
    for (let i = 0; i < 5; i++) {
      let inv = spawnInvader();
      inv.tenor = randEl(['T/N','S/N']);
      inv.size = randInt(10, 40) * 50;
      inv.speed *= 1.3;
      game.invaders.push(inv);
    }
  }
  if (evt.effect === 'split') {
    let clones = [];
    game.invaders.forEach(inv => {
      if (inv.alive && Math.random() < 0.4) {
        clones.push({ ...inv, x: inv.x + randInt(-20, 20), isLHS: !inv.isLHS });
      }
    });
    game.invaders.push(...clones);
  }
  if (evt.effect === 'shift') {
    if (evt.name.includes('LDN')) game.sessionCity = 'LONDON';
    else if (evt.name.includes('NY')) game.sessionCity = 'NEW YORK';
    else game.sessionCity = 'SYDNEY';
  }
}

function addParticles(x, y, count, good) {
  for (let i = 0; i < count; i++) {
    game.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 20 + Math.random() * 15,
      good,
    });
  }
}

function resetGame() {
  game.state = 'playing';
  game.score = 0;
  game.lives = 5;
  game.wave = 1;
  game.streak = 0;
  game.bestStreak = 0;
  game.missed = 0;
  game.invaders = [];
  game.bullets = [];
  game.particles = [];
  game.floatTexts = [];
  game.event = null;
  game.eventTimer = 0;
  game.spawnTimer = 0;
  game.waveKills = 0;
  game.waveTarget = 10;
  game.player.x = canvas.width / 2 - 18;
  game.player.y = canvas.height - 40;
  game.sessionCity = 'SYDNEY';
  game.flashMsg = 'WAVE 1 - SHORT DATES';
  game.flashTimer = 90;
  game.bulletCooldown = 0;
}

// ---- UPDATE ----
function update() {
  if (game.state === 'title') { game.titleAnim++; return; }
  if (game.state !== 'playing') return;

  if (game.bulletCooldown > 0) game.bulletCooldown--;

  if (game.keys.left) game.player.x -= game.player.speed;
  if (game.keys.right) game.player.x += game.player.speed;
  game.player.x = Math.max(0, Math.min(canvas.width - game.player.w, game.player.x));

  game.spawnTimer++;
  let rate = Math.max(40, game.spawnRate - game.wave * 3);
  if (game.event && (game.event.effect === 'flood' || game.event.effect === 'boss')) rate = 25;
  if (game.spawnTimer >= rate) {
    game.spawnTimer = 0;
    game.invaders.push(spawnInvader());
  }

  if (game.event) {
    game.eventTimer--;
    if (game.eventTimer <= 0) game.event = null;
  }

  if (!game.event && Math.random() < 0.0015 + game.wave * 0.0008) triggerEvent();
  if (game.flashTimer > 0) game.flashTimer--;

  game.bullets.forEach(b => {
    if (!b.alive) return;
    b.y -= b.speed;
    if (b.y < -10) b.alive = false;
  });

  game.invaders.forEach(inv => {
    if (!inv.alive) return;
    inv.y += inv.speed;
    if (inv.flash > 0) inv.flash--;

    // Direct collision with player = lose a life
    if (inv.y + inv.h > game.player.y && inv.y < game.player.y + game.player.h &&
        inv.x + inv.w > game.player.x && inv.x < game.player.x + game.player.w) {
      inv.alive = false;
      game.lives--;
      game.streak = 0;
      game.flashMsg = 'FILLED! OUCH!';
      game.flashTimer = 60;
      addParticles(game.player.x + game.player.w/2, game.player.y, 12, false);
      if (game.lives <= 0) {
        game.state = 'gameover';
        if (game.score > game.highScore) {
          game.highScore = game.score;
          localStorage.setItem('stirboy_hi', game.highScore.toString());
        }
      }
      return;
    }

    // Off screen = taunt, no life lost
    if (inv.y > canvas.height + 10) {
      inv.alive = false;
      game.missed++;
      game.streak = 0;
      addFloatText(canvas.width / 2, canvas.height - 50, randEl(MISS_TAUNTS), false);
    }
  });

  // Bullet-invader collisions
  game.bullets.forEach(b => {
    if (!b.alive) return;
    game.invaders.forEach(inv => {
      if (!inv.alive) return;
      if (b.x + b.w > inv.x && b.x < inv.x + inv.w &&
          b.y < inv.y + inv.h && b.y + b.h > inv.y) {
        b.alive = false;

        if (b.isLHS === inv.isLHS) {
          inv.hp--;
          if (inv.hp <= 0) {
            inv.alive = false;
            game.streak++;
            if (game.streak > game.bestStreak) game.bestStreak = game.streak;
            let mult = Math.min(game.streak, 10);
            let pts = Math.floor(inv.size / 10) * mult;
            game.score += pts;
            game.waveKills++;
            addParticles(inv.x + inv.w/2, inv.y + inv.h/2, 8, true);
            addFloatText(inv.x + inv.w/2, inv.y, '+' + pts, true);

            if (game.waveKills >= game.waveTarget) {
              game.wave++;
              game.waveKills = 0;
              game.waveTarget = 10 + game.wave * 2;
              game.flashMsg = 'WAVE ' + game.wave + ' - ' + getWaveConfig().label;
              game.flashTimer = 100;
            }
          } else {
            inv.flash = 8;
            addParticles(b.x, b.y, 4, true);
          }
        } else {
          let penalty = Math.floor(inv.size / 20);
          game.score = Math.max(0, game.score - penalty);
          game.streak = 0;
          inv.flash = 15;
          game.flashMsg = 'WRONG SIDE!';
          game.flashTimer = 50;
          addParticles(inv.x + inv.w/2, inv.y + inv.h/2, 6, false);
          addFloatText(inv.x + inv.w/2, inv.y, '-' + penalty, false);
        }
      }
    });
  });

  game.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  game.floatTexts.forEach(f => { f.y -= 0.8; f.life--; });

  game.invaders = game.invaders.filter(i => i.alive);
  game.bullets = game.bullets.filter(b => b.alive);
  game.particles = game.particles.filter(p => p.life > 0);
  game.floatTexts = game.floatTexts.filter(f => f.life > 0);
}

// ---- DRAW ----
function drawPixelText(text, x, y, size) {
  ctx.font = size + 'px "Press Start 2P"';
  ctx.fillText(text, x, y);
}

function drawPlayer() {
  let p = game.player;
  ctx.fillStyle = GB.darkest;
  ctx.fillRect(p.x + 4, p.y, p.w - 8, p.h);
  ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
  ctx.fillStyle = GB.light;
  ctx.fillRect(p.x + 6, p.y + 2, p.w - 12, 5);
  ctx.fillStyle = GB.darkest;
  ctx.fillRect(p.x + p.w/2 - 1, p.y - 8, 2, 8);
  ctx.fillRect(p.x + p.w/2 - 5, p.y - 8, 10, 2);
}

function drawInvader(inv) {
  let col = inv.flash > 0 ? (inv.flash % 2 === 0 ? GB.light : GB.lightest) : GB.darkest;

  ctx.fillStyle = col;
  ctx.fillRect(inv.x + 2, inv.y + 2, inv.w - 4, inv.h - 4);
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  ctx.strokeRect(inv.x, inv.y, inv.w, inv.h);

  // Side indicator stripe
  ctx.fillStyle = inv.isLHS ? '#882222' : '#224488';
  ctx.fillRect(inv.x + 3, inv.y + 3, 6, inv.h - 6);

  // Text
  let textCol = inv.flash > 0 ? GB.darkest : GB.bg;
  ctx.fillStyle = textCol;
  let side = inv.isLHS ? 'LHS' : 'RHS';
  drawPixelText(side + ' ' + inv.ccy, inv.x + 12, inv.y + 15, 9);
  drawPixelText(inv.tenor + ' ' + formatSize(inv.size), inv.x + 12, inv.y + 28, 8);
}

function drawBullet(b) {
  ctx.fillStyle = GB.darkest;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = b.isLHS ? '#882222' : '#224488';
  ctx.fillRect(b.x + (b.isLHS ? 0 : 2), b.y, 2, b.h);
}

function drawHUD() {
  let cw = canvas.width;

  // P&L
  let pnl = '+' + (game.score / 1000).toFixed(1) + 'mio';
  ctx.fillStyle = GB.darkest;
  drawPixelText('P&L:' + pnl, 4, 16, 10);

  // Lives (small blocks)
  for (let i = 0; i < game.lives; i++) {
    ctx.fillStyle = GB.darkest;
    ctx.fillRect(cw - 16 - i * 16, 4, 12, 10);
  }

  // Wave
  ctx.fillStyle = GB.dark;
  drawPixelText('W' + game.wave, cw - 50, 26, 8);

  // Streak
  if (game.streak > 1) {
    drawPixelText('x' + game.streak, 4, 30, 8);
  }

  // Missed
  if (game.missed > 0) {
    ctx.fillStyle = GB.dark;
    let mt = 'MISS:' + game.missed;
    let mw = ctx.measureText(mt).width;
    drawPixelText(mt, (cw - mw) / 2, 26, 8);
  }

  // Session city
  ctx.fillStyle = GB.dark;
  ctx.font = '8px "Press Start 2P"';
  let cityW = ctx.measureText(game.sessionCity).width;
  ctx.fillText(game.sessionCity, (cw - cityW) / 2, 14);

  // Float texts
  game.floatTexts.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = f.good ? GB.darkest : GB.dark;
    ctx.font = '10px "Press Start 2P"';
    let tw = ctx.measureText(f.text).width;
    ctx.fillText(f.text, f.x - tw/2, f.y);
    ctx.globalAlpha = 1;
  });

  // Event banner
  if (game.flashTimer > 0 && game.flashMsg) {
    let alpha = game.flashTimer > 25 ? 1 : game.flashTimer / 25;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = GB.darkest;
    ctx.fillRect(0, canvas.height / 2 - 20, cw, 40);
    ctx.fillStyle = GB.lightest;
    ctx.font = '12px "Press Start 2P"';
    let tw = ctx.measureText(game.flashMsg).width;
    ctx.fillText(game.flashMsg, (cw - tw) / 2, canvas.height / 2 + 5);
    ctx.globalAlpha = 1;
  }

  // Event progress bar
  if (game.event) {
    ctx.fillStyle = GB.dark;
    ctx.fillRect(0, canvas.height - 5, cw * (game.eventTimer / game.event.duration), 4);
  }
}

function drawTitle() {
  ctx.fillStyle = GB.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let cw = canvas.width;
  let ch = canvas.height;
  let bob = Math.sin(game.titleAnim * 0.05) * 4;

  ctx.fillStyle = GB.darkest;
  ctx.font = '20px "Press Start 2P"';
  let t1 = 'STIRBOY';
  ctx.fillText(t1, (cw - ctx.measureText(t1).width) / 2, ch * 0.18 + bob);

  ctx.font = '14px "Press Start 2P"';
  let t2 = 'TOMNEXTER';
  ctx.fillText(t2, (cw - ctx.measureText(t2).width) / 2, ch * 0.24 + bob);

  // Animated ccys
  let time = game.titleAnim * 0.03;
  let gap = cw / (CCYS.length + 1);
  ctx.font = '8px "Press Start 2P"';
  CCYS.forEach((ccy, i) => {
    let ix = gap * (i + 1);
    let iy = ch * 0.32 + Math.sin(time + i * 0.8) * 8;
    ctx.fillStyle = GB.darkest;
    ctx.fillRect(ix - 20, iy - 10, 40, 18);
    ctx.fillStyle = GB.bg;
    ctx.fillText(ccy, ix - 14, iy + 3);
  });

  // Blink
  ctx.fillStyle = GB.dark;
  if (Math.floor(game.titleAnim / 30) % 2) {
    ctx.font = '12px "Press Start 2P"';
    let t3 = 'TAP TO START';
    ctx.fillText(t3, (cw - ctx.measureText(t3).width) / 2, ch * 0.48);
  }

  // Instructions
  ctx.font = '8px "Press Start 2P"';
  let lines = [
    'LHS = SELL    RHS = BUY',
    '',
    'MATCH THE SIDE ON EACH',
    'PRICE REQUEST TO HEDGE',
    '',
    'WRONG SIDE = LOSE P&L',
    'DIRECT HIT = LOSE LIFE',
  ];
  let startY = ch * 0.58;
  lines.forEach((line, i) => {
    let wl = ctx.measureText(line).width;
    ctx.fillText(line, (cw - wl) / 2, startY + i * 16);
  });

  if (game.highScore > 0) {
    ctx.font = '8px "Press Start 2P"';
    let t7 = 'BEST: +' + (game.highScore / 1000).toFixed(1) + 'mio';
    ctx.fillText(t7, (cw - ctx.measureText(t7).width) / 2, ch * 0.93);
  }
}

function drawGameOver() {
  let cw = canvas.width;
  let ch = canvas.height;
  let boxW = Math.min(cw * 0.85, 300);
  let boxH = 180;
  let boxX = (cw - boxW) / 2;
  let boxY = ch / 2 - boxH / 2;

  ctx.fillStyle = GB.darkest;
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = GB.light;
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX + 2, boxY + 2, boxW - 4, boxH - 4);

  ctx.fillStyle = GB.lightest;
  ctx.font = '14px "Press Start 2P"';
  let t1 = 'BLOWN UP!';
  ctx.fillText(t1, (cw - ctx.measureText(t1).width) / 2, boxY + 30);

  ctx.font = '9px "Press Start 2P"';
  let pnl = '+' + (game.score / 1000).toFixed(1) + 'mio';
  let stats = [
    'FINAL P&L: ' + pnl,
    'WAVE: ' + game.wave,
    'BEST STREAK: ' + game.bestStreak,
    'MISSED: ' + game.missed,
  ];
  stats.forEach((line, i) => {
    let wl = ctx.measureText(line).width;
    ctx.fillText(line, (cw - wl) / 2, boxY + 55 + i * 22);
  });

  if (game.score >= game.highScore && game.score > 0) {
    ctx.font = '8px "Press Start 2P"';
    let t5 = 'NEW HIGH SCORE!';
    ctx.fillText(t5, (cw - ctx.measureText(t5).width) / 2, boxY + 148);
  }

  if (Math.floor(Date.now() / 500) % 2) {
    ctx.font = '8px "Press Start 2P"';
    let t6 = 'TAP TO CONTINUE';
    ctx.fillText(t6, (cw - ctx.measureText(t6).width) / 2, boxY + 170);
  }
}

function draw() {
  ctx.fillStyle = GB.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (game.state === 'title') { drawTitle(); return; }

  let shakeX = 0, shakeY = 0;
  if (game.event && (game.event.effect === 'chaos' || game.event.effect === 'boss')) {
    shakeX = (Math.random() - 0.5) * 4;
    shakeY = (Math.random() - 0.5) * 4;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  game.invaders.forEach(inv => { if (inv.alive) drawInvader(inv); });
  game.bullets.forEach(b => { if (b.alive) drawBullet(b); });
  game.particles.forEach(p => {
    ctx.fillStyle = p.good ? GB.darkest : GB.dark;
    ctx.globalAlpha = p.life / 35;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  });
  drawPlayer();
  ctx.restore();

  drawHUD();

  if (game.state === 'gameover') drawGameOver();
  if (game.state === 'paused') {
    ctx.fillStyle = GB.darkest;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.fillStyle = GB.lightest;
    ctx.font = '16px "Press Start 2P"';
    let tp = 'PAUSED';
    ctx.fillText(tp, (canvas.width - ctx.measureText(tp).width) / 2, canvas.height / 2);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ---- CONTROLS ----
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') game.keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') game.keys.right = true;
  if (e.key === 'z' || e.key === ',') fireBullet(true);
  if (e.key === 'x' || e.key === '.') fireBullet(false);
  if (e.key === ' ') { e.preventDefault(); fireBullet(true); }
  if (e.key === 'Enter') {
    if (game.state === 'title') resetGame();
    else if (game.state === 'gameover') game.state = 'title';
  }
  if (e.key === 'p' || e.key === 'Escape') {
    if (game.state === 'playing') game.state = 'paused';
    else if (game.state === 'paused') game.state = 'playing';
  }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') game.keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') game.keys.right = false;
});

// Touch hold for arrows
function setupHold(id, down, up) {
  let el = document.getElementById(id);
  if (!el) return;
  let holding = false;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); holding = true; down(); }, { passive: false });
  el.addEventListener('touchend', (e) => { e.preventDefault(); holding = false; up(); }, { passive: false });
  el.addEventListener('touchcancel', (e) => { e.preventDefault(); holding = false; up(); }, { passive: false });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); holding = true; down(); });
  el.addEventListener('mouseup', (e) => { e.preventDefault(); holding = false; up(); });
  el.addEventListener('mouseleave', () => { if (holding) { holding = false; up(); } });
}

function setupTap(id, fn) {
  let el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); fn(); });
}

setupHold('dLeft', () => game.keys.left = true, () => game.keys.left = false);
setupHold('dRight', () => game.keys.right = true, () => game.keys.right = false);
setupTap('btnLHS', () => fireBullet(true));
setupTap('btnRHS', () => fireBullet(false));

document.getElementById('btnStart').addEventListener('click', () => {
  if (game.state === 'title') resetGame();
  else if (game.state === 'gameover') game.state = 'title';
  else if (game.state === 'paused') game.state = 'playing';
});
document.getElementById('btnPause').addEventListener('click', () => {
  if (game.state === 'playing') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'playing';
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (game.state === 'title') resetGame();
  else if (game.state === 'gameover') game.state = 'title';
}, { passive: false });
canvas.addEventListener('click', () => {
  if (game.state === 'title') resetGame();
  else if (game.state === 'gameover') game.state = 'title';
});

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

resizeCanvas();
gameLoop();
</script>
</body>
</html>
